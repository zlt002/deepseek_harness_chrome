name: Build Windows Lite

on:
  push:
    branches:
      - codex/windows-lite-*
  workflow_dispatch:
    inputs:
      version:
        description: AccrUI-compatible extension version
        required: true
        default: 1.1.63
      full_validation:
        description: Run full acceptance tests (~38 min added) for pre-release validation
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-lite:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out extension release source
        uses: actions/checkout@v4
        with:
          path: deepseek_harness_chrome
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install product dependencies
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify clean pinned Harness upstream
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: pnpm verify:upstream

      - name: Compute upstream submodule hash
        id: upstream-hash
        working-directory: deepseek_harness_chrome
        shell: bash
        run: echo "sha=$(git ls-tree HEAD upstream/deepseek-harness | awk '{print $3}')" >> $GITHUB_OUTPUT

      - name: Cache harness product
        id: cache-harness-product
        uses: actions/cache@v4
        with:
          path: deepseek_harness_chrome/.generated/harness-product
          key: harness-product-v1-${{ hashFiles('deepseek_harness_chrome/upstream-contributions/**/*.patch', 'deepseek_harness_chrome/scripts/materialize-harness-product.mjs', 'deepseek_harness_chrome/.gitmodules') }}-${{ steps.upstream-hash.outputs.sha }}

      - name: Build materialized Harness product
        if: steps.cache-harness-product.outputs.cache-hit != 'true'
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: pnpm build:harness-product

      - name: Cache Windows Harness runtime
        id: cache-harness-runtime
        uses: actions/cache@v4
        with:
          path: deepseek_harness_chrome/release/windows-lite/harness-runtime-win32-x64
          key: harness-runtime-v1-${{ hashFiles('deepseek_harness_chrome/release/windows-lite/materialize-harness-runtime.mjs', 'deepseek_harness_chrome/upstream-contributions/**/*.patch', 'deepseek_harness_chrome/scripts/materialize-harness-product.mjs', 'deepseek_harness_chrome/.gitmodules') }}-${{ steps.upstream-hash.outputs.sha }}

      - name: Materialize Windows Harness runtime
        if: steps.cache-harness-runtime.outputs.cache-hit != 'true'
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: >-
          pnpm materialize:windows-harness-runtime --
          --source .generated/harness-product
          --out release/windows-lite/harness-runtime-win32-x64
          --revision ${{ steps.upstream-hash.outputs.sha }}

      - name: Build AccrUI-compatible Windows package
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: >-
          pnpm release:windows-lite --
          --harness-runtime release/windows-lite/harness-runtime-win32-x64
          --version "${{ inputs.version || '1.1.63' }}"

      - name: Accept Windows install, Native Messaging, upgrade, and rollback
        if: ${{ inputs.full_validation == true }}
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: >-
          ./release/windows-lite/acceptance-windows.ps1
          -PackageDir release/accr-ui-windows-lite-x64
          -ExpectedVersion "${{ inputs.version || '1.1.63' }}"

      - name: Write checksum
        working-directory: deepseek_harness_chrome
        shell: pwsh
        run: |
          $zip = 'release/accr-ui-windows-lite-x64.zip'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  accr-ui-windows-lite-x64.zip`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload Windows candidate to draft release
        working-directory: deepseek_harness_chrome
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-lite-v${{ inputs.version || '1.1.63' }}-candidate
          RELEASE_VERSION: ${{ inputs.version || '1.1.63' }}
        run: |
          $repo = '${{ github.repository }}'
          $zip = 'release/accr-ui-windows-lite-x64.zip'
          $checksum = "$zip.sha256"

          gh release view $env:RELEASE_TAG --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $repo `
              --draft `
              --target '${{ github.sha }}' `
              --title "Harness UI Windows Lite $env:RELEASE_VERSION (candidate)" `
              --notes "Windows x64 candidate for AccrUI-compatible Harness UI $env:RELEASE_VERSION. Visual Chrome/Edge sidepanel UAT on a target Windows machine is required."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release edit $env:RELEASE_TAG `
            --repo $repo `
            --target '${{ github.sha }}' `
            --title "Harness UI Windows Lite $env:RELEASE_VERSION (candidate)" `
            --notes "Windows x64 candidate for AccrUI-compatible Harness UI $env:RELEASE_VERSION. Visual Chrome/Edge sidepanel UAT on a target Windows machine is required."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release upload $env:RELEASE_TAG $zip $checksum --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
